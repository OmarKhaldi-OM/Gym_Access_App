spring.application.name=GYM_App
spring.config.import=optional:file:../frontend/.env.local[.properties],optional:file:./frontend/.env.local[.properties]
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gymbd?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
app.jwt.secret=${JWT_SECRET:}
app.google.client-id=${GOOGLE_CLIENT_ID:${VITE_GOOGLE_CLIENT_ID:}}
app.upload-dir=${APP_UPLOAD_DIR:uploads/profile-photos}
app.face-recognition.url=${FACE_RECOGNITION_URL:http://127.0.0.1:8001}
app.face-recognition.key=${FACE_SERVICE_KEY:}
app.face-recognition.minimum-accepted-similarity=0.40
app.face-recognition.minimum-account-match-margin=0.05
app.auth.face-login.block-admin=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB