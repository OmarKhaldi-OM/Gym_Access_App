spring.application.name=GYM_App
server.port=${SERVER_PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gymbd?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
app.jwt.secret=${JWT_SECRET:gate-local-development-key-change-before-deployment-2026}
app.upload-dir=${APP_UPLOAD_DIR:uploads/profile-photos}
app.face-recognition.url=${FACE_RECOGNITION_URL:http://localhost:8001}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB